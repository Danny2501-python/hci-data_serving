name: Deploy DBT Data Serving to NFS
on:
  push:
    branches:
      - master
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Deploy DBT Project to NFS
        run: |
          echo "🚀 Deploying DBT Data Serving to NFS..."
          
          # Đảm bảo thư mục đích tồn tại
          mkdir -p /mnt/nfs_share/dbt/data_serving

          # Đồng bộ toàn bộ nội dung repo sang NFS
          # Loại trừ .git, target (build artifacts), logs và các file cache
          rsync -av --delete \
            --exclude='.git' \
            --exclude='target' \
            --exclude='logs' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            ./ /mnt/nfs_share/dbt/data_serving/
          
          # Xóa logs và target cũ trên NFS nếu có để tránh conflict quyền và rác
          rm -rf /mnt/nfs_share/dbt/data_serving/logs /mnt/nfs_share/dbt/data_serving/target

          # Set quyền rộng rãi cho thư mục cha để bất kỳ user nào chạy dbt cũng tự tạo lại được logs/target
          chmod -R 777 /mnt/nfs_share/dbt/data_serving
          
          echo "✅ DBT Data Serving deployed successfully!"
