    import_banggia_sci:
      +tags: ["import_banggia_sci"]
      stg:
        +materialized: ephemeral
      # int is table here for the same reason as import_dichvu_sci: 'a', 'g' and
      # 'ir_model_data_data' are each ref'd from multiple downstream steps (see LOGIC.md
      # mapping table) - ephemeral would recompute the parent CTE on every ref.
      int:
        +materialized: table
      mart:
        +materialized: table

    import_nhomdichvu_sci:
      +tags: ["import_nhomdichvu_sci"]
      stg:
        +materialized: ephemeral
      # int is table here for the same reason as import_dichvu_sci/import_banggia_sci:
      # 'output_data' được cả note_data và type_data_nhomdichvu (2 lần: trực tiếp 'nd'
      # + subquery 'f') cùng ref - ephemeral sẽ tính lại toàn bộ CTE cha mỗi lần ref.
      int:
        +materialized: table
      mart:
        +materialized: table
# report_table_definitions/report_column_definitions: business context for
# dwh_chat_app's LLM (chat over report data), maintained by the data team as
# these seed CSVs instead of a separate admin UI. +column_types forces
# `description` to text (unbounded) instead of dbt inferring a varchar(n)
# sized off today's longest row, which would silently truncate future edits.
seeds:
  data_serving:
    report_table_definitions:
      +column_types:
        schema_name: varchar(63)
        table_name: varchar(63)
        description: text
    report_column_definitions:
      +column_types:
        schema_name: varchar(63)
        table_name: varchar(63)
        column_name: varchar(63)
        description: text