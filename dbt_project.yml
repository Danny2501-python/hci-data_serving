
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'data_serving'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'data_serving'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Project variables
vars:
  # Adjust start_date for backfill
  start_date: '2025-08-01'
  all_brand_etl: "(1,3,4,7)"

# Model configurations
models:
  data_serving:
    common:
      +materialized: ephemeral
    func_report_marketing_ad_cost_kn:
      +tags: ["report_kn"]
      stg:
        +materialized: ephemeral
      int:
        +materialized: ephemeral
      mart:
        +materialized: table
    func_report_marketing_ad_cost_pr:
      +tags: ["report_pr"]
      stg:
        +materialized: ephemeral
      int:
        +materialized: ephemeral
      mart:
        +materialized: table
    pretransformation_table_set:
      +tags: ["staging_tables"]
      stg:
        +materialized: ephemeral
      int:
        +materialized: ephemeral
      mart:
        +materialized: table
    report_marketing_kn_dvda:
      +tags: ["report_kn_dvda"]
      stg:
        +materialized: ephemeral
      int:
        +materialized: ephemeral
      mart:
        +materialized: table
    report_hqcd_page:
      +tags: ["report_hqcd_page"]
      stg:
        +materialized: ephemeral
      int:
        +materialized: ephemeral
      mart:
        +materialized: table
    report_deposit:
      +tags: ["report_dps"]
      stg:
        +materialized: ephemeral
      int:
        +materialized: ephemeral
      mart:
        +materialized: table