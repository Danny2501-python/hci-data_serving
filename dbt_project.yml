# report_table_definitions/report_column_definitions: business context for
# dwh_chat_app's LLM (chat over report data), maintained by the data team as
# these seed CSVs instead of a separate admin UI. +column_types forces
# `description` to text (unbounded) instead of dbt inferring a varchar(n)
# sized off today's longest row, which would silently truncate future edits.
seeds:
  data_serving:
    report_table_definitions:
      +column_types:
        schema_name: varchar(63)
        table_name: varchar(63)
        description: text
    report_column_definitions:
      +column_types:
        schema_name: varchar(63)
        table_name: varchar(63)
        column_name: varchar(63)
        description: text
    # Seed dung cho func_report_marketing_ad_cost_kn: gan tag report_kn de
    # `dbt build --select tag:report_kn` load seed truoc khi build model.
    campaign_name_split:
      +tags: ["report_kn"]
    ucbt_camp_actor:
      +tags: ["report_kn"]
    ucbt_country_continent:
      +tags: ["report_kn"]
    ucbt_page_config:
      +tags: ["report_kn"]
    rtr_target:
      # Gan tag report_thv_revenue de `dbt build --select tag:report_thv_revenue`
      # (DAG data_serving_thv_revenue_etl) tu load lai seed truoc khi build model.
      +tags: ["report_thv_revenue"]
      # Target/chi tieu doanh thu THV theo thang - doi ke hoach tu sua file
      # seeds/rtr_target.csv (Excel/CSV) roi chay `dbt seed --select rtr_target`,
      # khong can sua SQL nua (thay cho VALUES hard-code cu trong
      # models/report_thv_revenue/int/rtr_target.sql, da xoa).
      # Doi target: THEM DONG MOI (active=true), dong thoi sua dong active=true
      # cu (cung ngay_dau_thang+chi_tieu) thanh active=false - KHONG xoa dong
      # cu, de giu lich su. rtr_target_latest (int) chi lay cac dong
      # active=true cho bao cao dung. ngay_cap_nhat chi de tham khao/audit khi
      # xem lai lich su, khong dung de suy ra ban hien hanh nua.
      # (Luu y: comment trong dbt_project.yml khong duoc go dau tieng Viet -
      # dbt doc file nay bang encoding he thong (cp1252 tren Windows) o 1 buoc
      # noi bo, ky tu co dau se gay UnicodeDecodeError. Cac file .sql khac
      # khong bi anh huong, van go dau binh thuong duoc.)
      +column_types:
        ngay_dau_thang: date
        chi_tieu: varchar(32)
        target: bigint
        ngay_cap_nhat: date
        active: boolean
    # 2026-08-31 (data_demo -> Tableau "Doanh so" report, xem report_tableau_doanh_so_tap_doan_HCI/
    # mart/report_rtds_doanh_so_thang_tableau.sql + report_rtds_target_thang_tableau.sql): gia tri
    # tien VND vuot range integer 32-bit (>2,1 ty) - ep bigint tranh loi "integer out of range".
    seed_doanh_so_2025_mockup:
      +tags: ["rtds"]
      +column_types:
        tong_so_tien: bigint
    seed_target_thv_2026_mockup:
      +column_types:
        target: bigint
    # 2026-09-16: seed "so chot" thu cong cho Hong Ha (THV da bo ra tu 2026-09-26, dung live tu
    # report_thv_revenue) - ghi de tam so doanh so ra bao cao cho CAC THANG DA QUA (khong ap dung
    # thang hien tai), luong dbt tu dong (int_rtds_hongha.sql) van chay song song de doi soat -
    # xem report_rtds_doanh_so_thang_tableau.sql.
    # 2026-09-26: TAT ghi de so chot (var rtds_ap_dung_so_chot: false) - bao cao dung so tinh dbt
    # (int_rtds_hongha: doanh so hahth - tui nguc/mong - luong BS PTTM). Seed VAN GIU DU LIEU de so
    # sanh. Khai bao du kieu cot cho on dinh (tranh dbt tu suy kieu sai).
    seed_doanh_so_chot_hongha_thv:
      +tags: ["rtds"]
      +column_types:
        brand: varchar(64)
        nam: integer
        thang: integer
        tong_so_tien: bigint
