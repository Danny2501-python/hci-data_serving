version: 2

seeds:
  - name: stag_product_backfill_sandbox
    description: >
      Backfill thu công cho stag_products: ~9.209 sản phẩm brand EHC (default_code
      'EHC*') tồn tại ở sandbox (staging_sci) nhưng bị loại khỏi output của
      int_stps_product_map trên target new_product vì thiếu dòng brand_etl=1 (kn)
      tương ứng trong public.product_product của new_product (gap đồng bộ ERP,
      không phải lỗi logic dbt — xem knowledge.md cạnh stag_products.sql).
      Union vào stag_products qua anti-join theo product_id nên tự nhường chỗ cho
      dữ liệu thật một khi new_product được đồng bộ đủ.
    config:
      column_types:
        smhcsid: integer
        product_id: integer
        his_service_type: varchar
        surgery_type: varchar
        product_category: varchar
        product_category_paris: varchar
        product_category_new: varchar
        default_code: varchar
        product: varchar
        list_price: numeric
        group_id: varchar
        kpi_point: numeric
        kpi_point_num: integer
        product_id_kn: varchar
        product_ctg_id: integer
        is_main_service: boolean
        uom_id: integer
        uom: varchar
        is_no_kpi: boolean
        kdtc_product_ctg_id: integer
        create_date: timestamp
        write_date: timestamp
        is_vip: boolean
        kpi_first_time: "double precision"
        gr_bh_id: integer
        qty_service: integer
        pr_product_id: integer
        hh_product_id: integer
        sci_product_id: integer
        thv_product_id: integer
        product_tmpl_id: integer
        pr_product_tmpl_id: integer
        hh_product_tmpl_id: integer
        sci_product_tmpl_id: integer
        thv_product_tmpl_id: integer
        pr_product_ctg_id: integer
        hh_product_ctg_id: integer
        sci_product_ctg_id: integer
        thv_product_ctg_id: integer
        pr_smhcsid: integer
        hh_smhcsid: integer
        sci_smhcsid: integer
        thv_smhcsid: integer
  - name: ucbt_country_continent
    config:
      column_types:
        id: integer
        country: varchar
        continent: varchar
  - name: ucbt_page_config
    description: >
      Cấu hình page (page_code -> page_name/brand/channel...) dùng ở
      func_report_marketing_ad_cost_kn qua ref(). page_id để varchar (id Facebook
      dài, có dòng trống) — downstream đã cast ::text khi so khớp.
    config:
      column_types:
        page_name: varchar
        page_id: varchar
        type: varchar
        group: varchar
        channel: varchar
        brand: varchar
        page_code: varchar
  - name: ucbt_camp_actor
    config:
      column_types:
        name: varchar
        email: varchar
        actor_code: varchar
  - name: campaign_name_split
    description: >
      Bảng map token nhóm dịch vụ trong tên campaign (campain_name_split, so khớp
      không phân biệt hoa/thường) sang tên nhóm dịch vụ chuẩn (nhom_dv). Dùng ở
      func_report_marketing_ad_cost_kn (int_frmack_fb_cost và
      mart_report_marketing_ad_cost_kn) qua ref() nên phải `dbt seed --select
      campaign_name_split` chạy trước `dbt build --select tag:report_kn`.
      Tên cột campain_name_split (thiếu chữ g) là cố ý, khớp với SQL đang dùng.
    config:
      column_types:
        campain_name_split: varchar
        nhom_dv: varchar
        snapshot_date: date
        ingestion_timestamp: timestamp
        source_server: varchar
  - name: import_stag_employee_null
    config:
      column_types:
        id: integer
        employee_code: varchar
        employee: varchar
        gender: varchar
        job: varchar
        department: varchar
        company: varchar
        staff_level: varchar
        area: varchar
        birthday: date
        place_of_birth: varchar
        identification_id: varchar
        barcode: varchar
        mobile_phone: varchar
        work_email: varchar
        create_date: timestamp
        write_date: timestamp
        active: boolean
        resign_date: date
        reason_resign: varchar
        job_lv2: varchar
        group_job_id: integer
        group_job: varchar
        team_id: integer
        team: varchar
        sector_id: integer
        sector: varchar
        user_id: integer
        job_id: integer
        department_id: integer
        company_id: integer
        brand_id: integer
        old_department_id: integer
        phongbanphanquyen: integer
        kn_id: integer
        kn_user_id: integer
        pr_id: integer
        pr_user_id: integer
        hh_id: integer
        hh_user_id: integer

  - name: seed_hh_target_md_ml
    description: >
      Mục tiêu doanh số MD / ML của Hồng Hà (brand_etl = 4) theo tháng 2026, người
      dùng cung cấp (bảng "Nguồn MD / Nguồn Offline", đơn vị nghìn đồng -> đã nhân
      1.000 ra đồng). chi_tieu: md = Nguồn MD, ml = Nguồn Offline. Dùng ở
      report_hh_thv_ds_kh/int/rhtdk_target_md_ml.
    config:
      column_types:
        ngay_dau_thang: date
        chi_tieu: varchar
        target: numeric

  - name: seed_ggs_target_sm_thv
    description: >
      TẠM THỜI: chép từ Google Sheet "Báo cáo Kinh doanh tự chủ 2025" (bản sao),
      tab ggs_target_sm_thv — mục tiêu các chỉ số marketing THV (brand_etl = 8)
      theo tháng: chi phí ads, inbox, SĐT thô/verify, booking, đến cửa, thành
      công, doanh số MKT không thuốc, tỷ lệ, CPI/CPL/CPB/CPO/CAC, ROI. Khi admin
      đồng bộ tab lên DB (public.ggs_target_sm_thv) thì rhtdk_target_sm tự đọc
      bảng DB (không cần sửa code) -> có thể xoá seed này.
    config:
      column_types:
        brand_etl: integer
        thang: date
        ma_chi_tieu: varchar
        ten_chi_tieu: varchar
        muc_tieu: numeric

  - name: seed_ggs_inbox_thv_hh
    description: >
      TẠM THỜI: cột inbox (số inbox mới theo ngày x brand_etl 4 HH / 8 THV) chép
      từ Google Sheet tab ggs_target_ads_thv_hh — job đồng bộ lên DB
      (public.ggs_target_ads_thv_hh) chưa lấy cột inbox. rhtdk_chi_phi_ads tự
      đọc cột inbox trên DB khi có (không cần sửa code) -> lúc đó xoá seed này.
    config:
      column_types:
        date: date
        brand_etl: integer
        inbox: numeric
