version: 2

seeds:
  - name: stag_product_backfill_sandbox
    description: >
      Backfill thu công cho stag_products: ~9.209 sản phẩm brand EHC (default_code
      'EHC*') tồn tại ở sandbox (staging_sci) nhưng bị loại khỏi output của
      int_stps_product_map trên target new_product vì thiếu dòng brand_etl=1 (kn)
      tương ứng trong public.product_product của new_product (gap đồng bộ ERP,
      không phải lỗi logic dbt — xem knowledge.md cạnh stag_products.sql).
      Union vào stag_products qua anti-join theo product_id nên tự nhường chỗ cho
      dữ liệu thật một khi new_product được đồng bộ đủ.
    config:
      column_types:
        smhcsid: integer
        product_id: integer
        his_service_type: varchar
        surgery_type: varchar
        product_category: varchar
        product_category_paris: varchar
        product_category_new: varchar
        default_code: varchar
        product: varchar
        list_price: numeric
        group_id: varchar
        kpi_point: numeric
        kpi_point_num: integer
        product_id_kn: varchar
        product_ctg_id: integer
        is_main_service: boolean
        uom_id: integer
        uom: varchar
        is_no_kpi: boolean
        kdtc_product_ctg_id: integer
        create_date: timestamp
        write_date: timestamp
        is_vip: boolean
        kpi_first_time: "double precision"
        gr_bh_id: integer
        qty_service: integer
        pr_product_id: integer
        hh_product_id: integer
        sci_product_id: integer
        thv_product_id: integer
        product_tmpl_id: integer
        pr_product_tmpl_id: integer
        hh_product_tmpl_id: integer
        sci_product_tmpl_id: integer
        thv_product_tmpl_id: integer
        pr_product_ctg_id: integer
        hh_product_ctg_id: integer
        sci_product_ctg_id: integer
        thv_product_ctg_id: integer
        pr_smhcsid: integer
        hh_smhcsid: integer
        sci_smhcsid: integer
        thv_smhcsid: integer
  - name: ucbt_country_continent
    config:
      column_types:
        id: integer
        country: varchar
        continent: varchar
  - name: campaign_name_split
    description: >
      Bảng map token nhóm dịch vụ trong tên campaign (campain_name_split, so khớp
      không phân biệt hoa/thường) sang tên nhóm dịch vụ chuẩn (nhom_dv). Dùng ở
      func_report_marketing_ad_cost_kn (int_frmack_fb_cost và
      mart_report_marketing_ad_cost_kn) qua ref() nên phải `dbt seed --select
      campaign_name_split` chạy trước `dbt run --select tag:report_kn`.
      Tên cột campain_name_split (thiếu chữ g) là cố ý, khớp với SQL đang dùng.
    config:
      column_types:
        campain_name_split: varchar
        nhom_dv: varchar
        snapshot_date: date
        ingestion_timestamp: timestamp
        source_server: varchar
  - name: import_stag_employee_null
    config:
      column_types:
        id: integer
        employee_code: varchar
        employee: varchar
        gender: varchar
        job: varchar
        department: varchar
        company: varchar
        staff_level: varchar
        area: varchar
        birthday: date
        place_of_birth: varchar
        identification_id: varchar
        barcode: varchar
        mobile_phone: varchar
        work_email: varchar
        create_date: timestamp
        write_date: timestamp
        active: boolean
        resign_date: date
        reason_resign: varchar
        job_lv2: varchar
        group_job_id: integer
        group_job: varchar
        team_id: integer
        team: varchar
        sector_id: integer
        sector: varchar
        user_id: integer
        job_id: integer
        department_id: integer
        company_id: integer
        brand_id: integer
        old_department_id: integer
        phongbanphanquyen: integer
        kn_id: integer
        kn_user_id: integer
        pr_id: integer
        pr_user_id: integer
        hh_id: integer
        hh_user_id: integer
